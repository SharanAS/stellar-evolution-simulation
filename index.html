<!DOCTYPE html>

<html lang="en">

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Star Selector</title>
	
	<link rel="stylesheet" href="style.css">
</head>

<body>

	<div id="space-background"></div>
	
	<h1>Star Selector</h1>
	
	
	
	<div class = "buttons">
	
		<button class="star-button">Red Dwarf</button>
		<button class="star-button">Yellow Dwarf</button>
		<button class="star-button">Blue Giant</button>
		<button class="star-button">Red Giant</button>
	</div>
	
	<h3 id="star-name">Red Dwarf</h3>
	<p id="star-size">Size: 0.09 - 0.6 times the radius of the Sun</p>
	<p id="star-color">Color: Reddish-Orange</p>
	<p id="star-temperature">Surface Temperature: 2000K to 3000K
	</p>
	
	
	
	<div id = "star"></div>
	<script src="script.js"></script>

</body>

</html>
